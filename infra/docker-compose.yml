services:
  backend:
    build:
      context: ..
      dockerfile: ./infra/builds/Dockerfile
      target: development
      args:
        - USER_ID=${HOST_UID:-1000}
        - GROUP_ID=${HOST_GID:-1000}
    image: dev-base:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    working_dir: /app
    command: >
      sh -c "pnpm install --frozen-lockfile --store-dir=/pnpm-store && pnpm --filter @model_md/database build && exec pnpm run dev:server"
    environment:
      - CI=true
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - TEST_USER_ID=${TEST_USER_ID}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - PNPM_CONFIG_STORE_DIR=/pnpm-store
    volumes:
      - ..:/app
      - main_node_modules:/app/node_modules
      - /app/apps/frontend/node_modules
      - /app/apps/backend/node_modules
      - /app/packages/database/node_modules
      - /app/apps/mcp-servers/mcp-database-service/node_modules
      - pnpm_store:/pnpm-store
    ports:
      - "3000:3000"
    networks:
      - dev-network
      - supabase_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/', (res) => { if (res.statusCode === 200 || res.statusCode === 404) { process.exit(0); } else { process.exit(1); } }).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: ./infra/builds/Dockerfile
      target: development
      args:
        - USER_ID=${HOST_UID:-1000}
        - GROUP_ID=${HOST_GID:-1000}
    image: dev-base:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    working_dir: /app
    command: pnpm run dev:client
    environment:
      - CI=true
      - VITE_HOST=0.0.0.0
      - VITE_PORT=5173
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - WATCHPACK_POLLING=true
      - PNPM_CONFIG_STORE_DIR=/pnpm-store
    volumes:
      - ..:/app
      - main_node_modules:/app/node_modules
      - /app/apps/frontend/node_modules
      - /app/apps/backend/node_modules
      - /app/packages/database/node_modules
      - /app/apps/mcp-servers/mcp-database-service/node_modules
      - pnpm_store:/pnpm-store
    ports:
      - "5173:5173"
    networks:
      - dev-network
    depends_on:
      backend:
        condition: service_healthy

  # Shared beads storage backend: one Dolt sql-server for ALL worktree beads
  # databases. beads pins Dolt to 2.2.0 (docs/architecture/dolt.md); each git
  # worktree gets its own database (model_md_worktree_<slug>), created by
  # `bd init --server` during orchestrator provisioning (CREATE DATABASE IF
  # NOT EXISTS at open). The official image entrypoint hardcodes
  # `--host=0.0.0.0 --port=3306` AND its readiness probe checks 3306, so the
  # server must stay on 3306; every client sets
  # BEADS_DOLT_SERVER_HOST=dolt / BEADS_DOLT_SERVER_PORT=3306.
  dolt:
    image: dolthub/dolt-sql-server:2.2.0
    container_name: dolt
    restart: always
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Dolt >= 1.46 restricts the root superuser to root@localhost by
      # default; beads connects as user "root" with no password, so grant
      # root@% on the internal dev-network (never published to the host).
      - DOLT_ROOT_HOST=%
    volumes:
      - dolt_data:/var/lib/dolt
    healthcheck:
      # dolt sql-server accepts on 127.0.0.1:3306 once ready; bash /dev/tcp
      # probe (the image entrypoint already depends on bash).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3306'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - dev-network
      # Agents run beads against the shared Dolt server from agent-network,
      # so dolt is dual-homed (dev-network: worker + spawned servers).
      - agent-network

  mcp-gateway:
    image: docker/mcp-gateway:v0.43.3
    profiles: ["agent-core"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: always
    depends_on:
      - mcp-socket-proxy
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      # Standalone gateway (Docker CE, no Docker Desktop): bypass Desktop
      # feature-flag checks and talk to the engine directly.
      - DOCKER_MCP_IN_CONTAINER=1
      # Talk to proxy instead of host unix socket
      - DOCKER_HOST=tcp://mcp-socket-proxy:2375
      # The generated catalog binds the project tree into the spawned MCP
      # server containers. docker/mcp-gateway refuses host paths outside its
      # default allowed roots (/tmp, /var/tmp) unless explicitly allow-listed.
      # Read-only binds may source anywhere under the project parent.
      - MCP_GATEWAY_DOCKER_BIND_ALLOWED_PATHS=${PROJECT_PARENT_PATH}
      # Writable binds are restricted to the worktrees directory (agents must
      # modify feature code) and the main repo's .git (git worktree metadata /
      # commits).
      - MCP_GATEWAY_DOCKER_BIND_ALLOW_WRITABLE_PATHS=${PROJECT_PARENT_PATH}/worktrees:${PROJECT_PARENT_PATH}/${PROJECT_NAME}/.git
      - MCP_GATEWAY_AUTH_TOKEN=${MCP_GATEWAY_AUTH_TOKEN}
    volumes:
      - ${LOCAL_MCP_REGISTRY}:/root/.docker/mcp
    ports:
      - "127.0.0.1:8811:8811"
    command:
      - --transport=streaming
      - --port=8811
      - --catalog=/root/.docker/mcp/catalogs/local-mcp.yaml
      - --servers=ast-explorer,supabase-manager,git-orchestrator
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8811/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      # dev-network stays FIRST: the gateway spawns MCP server containers there
      # (they must resolve `cache`, `mcp-socket-proxy`). agent-network is
      # appended LAST so adding agent-facing connectivity can never shift the
      # gateway's default spawn network.
      - dev-network
      - supabase_network
      - observability-bridge
      - agent-network

  orchestrator-worker:
    build:
      context: ..
      dockerfile: ./apps/mcp-servers/mcp-git-orchestrator/Dockerfile
      target: worker
      args:
        - USER_ID=${HOST_UID:-1000}
        - GROUP_ID=${HOST_GID:-1000}
    profiles: ["agent-core"]
    container_name: orchestrator-worker
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: always
    depends_on:
      mcp-socket-proxy:
        condition: service_started
      cache:
        condition: service_healthy
    environment:
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - PROJECT_NAME=${PROJECT_NAME}
      - PROJECT_PARENT_PATH=${PROJECT_PARENT_PATH}
      # The worker spawns feature containers via a nested `docker compose`; it
      # must interpolate the same host identity it itself runs as.
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - DBOS_SYSTEM_DATABASE_URL=${DATABASE_URL}
      - TEST_USER_ID=${TEST_USER_ID}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-${SUPABASE_URL}}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY}}
      - DOCKER_HOST=tcp://mcp-socket-proxy:2375
      # beads → shared Dolt server (the `dolt` service above). The worker
      # runs `bd init --server` when provisioning each worktree; bd inherits
      # these env vars for that and every subsequent connection.
      - BEADS_DOLT_SERVER_HOST=dolt
      - BEADS_DOLT_SERVER_PORT=3306
      - BEADS_DOLT_SERVER_MODE=1
    volumes:
      - ../..:/app
      - ../apps/mcp-servers/mcp-git-orchestrator/:/opt/orchestrator
      - /opt/orchestrator/__pycache__
      - /opt/orchestrator/.venv
      - /home/devuser
    networks:
      - dev-network
      - supabase_network

  antigravity:
    build:
      context: ..
      dockerfile: ./infra/builds/Dockerfile.ai_cli
      target: agent-antigravity
      args:
        - PROJECT_NAME=${PROJECT_NAME}
        - USER_ID=${HOST_UID:-1000}
        - GROUP_ID=${HOST_GID:-1000}
    profiles: ["antigravity"]
    container_name: antigravity_agent
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /home/devuser/.cache:mode=1777
      - /home/devuser/.gemini:mode=1777
    stdin_open: true
    tty: true
    working_dir: /app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MCPGATEWAY_ENDPOINT=http://mcp-gateway:8811/mcp
      - BEADS_DOLT_SERVER_HOST=dolt
      - BEADS_DOLT_SERVER_PORT=3306
      - BEADS_DOLT_SERVER_MODE=1
    volumes:
      - ../..:/app:ro
      - ${PROJECT_PARENT_PATH}/worktrees:/app/worktrees
      - ${PROJECT_PARENT_PATH}/.docker/antigravity/config:/home/devuser/.config/antigravity
    networks:
      - agent-network
    depends_on:
      - mcp-gateway

  pi:
    build:
      context: ..
      dockerfile: ./infra/builds/Dockerfile.ai_cli
      target: agent-pi
      args:
        - PROJECT_NAME=${PROJECT_NAME}
        - USER_ID=${HOST_UID:-1000}
        - GROUP_ID=${HOST_GID:-1000}
    profiles: ["pi"]
    container_name: pi_agent
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache:mode=1777
    stdin_open: true
    tty: true
    working_dir: /app/model_md
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - PI_CODING_AGENT_DIR=/home/node/.pi/agent
      - MCPGATEWAY_ENDPOINT=http://mcp-gateway:8811/mcp
      - BEADS_DOLT_SERVER_HOST=dolt
      - BEADS_DOLT_SERVER_PORT=3306
      - BEADS_DOLT_SERVER_MODE=1
      - MCP_GATEWAY_AUTH_TOKEN=${MCP_GATEWAY_AUTH_TOKEN}
    volumes:
      - ../..:/app:ro
      - ${PROJECT_PARENT_PATH}/worktrees:/app/worktrees
      - ${PROJECT_PARENT_PATH}/.docker/pi:/home/node/.pi
    networks:
      - agent-network
    depends_on:
      - mcp-gateway

  opencode:
    build:
      context: ..
      dockerfile: ./infra/builds/Dockerfile.ai_cli
      target: agent-opencode
      args:
        - PROJECT_NAME=${PROJECT_NAME}
        - USER_ID=${HOST_UID:-1000}
        - GROUP_ID=${HOST_GID:-1000}
    profiles: ["opencode"]
    container_name: opencode_agent
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # Explicit exec: Docker's default tmpfs options are noexec, which makes
      # dlopen of /tmp/*.node fail with EPERM (harmless watcher warnings, but
      # wrong). /home/devuser/.npm is tmpfs as belt-and-suspenders so any
      # runtime npm cache write can never EROFS against the read_only rootfs.
      - /tmp:mode=1777,exec
      - /home/devuser/.cache:mode=1777,exec
      - /home/devuser/.npm:mode=1777
    stdin_open: true
    tty: true
    working_dir: /app/model_md
    environment:
      - OPENCODE_CONFIG=/app/model_md/opencode.json
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
      - MCPGATEWAY_ENDPOINT=http://mcp-gateway:8811/mcp
      - BEADS_DOLT_SERVER_HOST=dolt
      - BEADS_DOLT_SERVER_PORT=3306
      - BEADS_DOLT_SERVER_MODE=1
      - MCP_GATEWAY_AUTH_TOKEN=${MCP_GATEWAY_AUTH_TOKEN}
      # oh-my-openagent writes per-session transcripts (and reads its
      # settings.json) under getClaudeConfigDir() = $CLAUDE_CONFIG_DIR or
      # ~/.claude. The rootfs is read_only and ~/.claude is not on tmpfs, so
      # every prompt EROFS'd (HTTP 500, frozen TUI). Point it at the writable
      # state bind mount instead (persists across restarts).
      - CLAUDE_CONFIG_DIR=/home/devuser/.local/state/claude
      # The TUI needs TERM to initialize rendering; docker exec does not
      # forward the host's TERM, so inject it here (baked from host value).
      - "TERM=${TERM:-xterm-256color}"
    volumes:
      - ../..:/app:ro
      - ${PROJECT_PARENT_PATH}/worktrees:/app/worktrees
      - omo_state:/app/${PROJECT_NAME}/.omo
      - ${PROJECT_PARENT_PATH}/.docker/opencode/config:/home/devuser/.config/opencode
      - ${PROJECT_PARENT_PATH}/.docker/opencode/share:/home/devuser/.local/share/opencode
      - ${PROJECT_PARENT_PATH}/.docker/opencode/state:/home/devuser/.local/state
    networks:
      - agent-network
    depends_on:
      - mcp-gateway

  cache:
    image: redis:8.8-alpine
    profiles: ["agent-core"]
    cap_drop:
      - ALL
    cap_add:
      # redis:alpine entrypoint drops from root to the redis user via gosu
      # (setuid/setgid) after chown'ing its data dir. Without these the
      # container exits 1 immediately under cap_drop ALL.
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

  mcp-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: mcp-socket-proxy
    profiles: ["agent-core"]
    restart: always
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - POST=1
      - EXEC=1
      - PRIVILEGED=0
      - VOLUMES=1
      - AUTH=0
      - SYSTEM=0
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - dev-network
      - observability-bridge
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  redis_data:
  dolt_data:
  pnpm_store:
    name: pnpm_store
  main_node_modules:
  omo_state:

networks:
  dev-network:
    driver: bridge
  # AI agent containers (pi, opencode, antigravity) live on agent-network.
  # From there the ONLY reachable services are mcp-gateway (8811, tool calls)
  # and dolt (3306, beads) - never the Docker socket proxy (2375), redis
  # cache, or the supabase stack.
  agent-network:
    driver: bridge
  supabase_network:
    external: true
    name: supabase_network_${PROJECT_NAME}
  observability-bridge:
    external: true
