version: "3"

dotenv: [".env"]

includes:
  db: ./tasks/db.yml
  obs: ./tasks/obs.yml
  mcp: ./tasks/mcp.yml
  ai: ./tasks/ai.yml
  feature: ./tasks/feature.yml

vars:
  AGENT_CORE: "agent-core"
  DOCKER_ENV: |
    export HOST_UID="${SUDO_UID:-$(id -u)}"
    export HOST_GID="${SUDO_GID:-$(id -g)}"
    if [ -S "$XDG_RUNTIME_DIR/docker.sock" ]; then
      export DOCKER_SOCKET_PATH="$XDG_RUNTIME_DIR/docker.sock"
      export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
    else
      export DOCKER_SOCKET_PATH="${DOCKER_SOCKET_PATH:-/var/run/docker.sock}"
      export DOCKER_GROUP_GID=$(getent group docker | cut -d: -f3)
    fi

tasks:
  up:
    desc: "Start the entire local dev environment"
    cmds:
      - task: db:up
      - task: obs:up
      - task: app:up

  down:
    desc: "Stop everything"
    cmds:
      - task: app:down
      - task: obs:down
      - task: db:down

  app:up:
    desc: "Start the full development stack"
    deps: [db:up, obs:up]
    vars:
      P_FLAG: '{{if .P}}--profile {{splitList " " .P | join " --profile "}}{{end}}'
    cmds:
      - |
        {{.DOCKER_ENV}}
        if [ ! -d "{{.PROJECT_PARENT_PATH}}" ]; then
          echo "ERROR: PROJECT_PARENT_PATH does not exist: {{.PROJECT_PARENT_PATH}}"
          echo "Set it to an absolute path in .env"
          exit 1
        fi
        docker compose --env-file .env -p {{.PROJECT_NAME}} -f infra/docker-compose.yml {{.P_FLAG}} up {{.CLI_ARGS}}

  app:down:
    vars:
      P_FLAG: '{{if .P}}--profile {{splitList " " .P | join " --profile "}}{{end}}'
    cmds:
      - docker compose --env-file .env -p {{.PROJECT_NAME}} {{.P_FLAG}} down {{.CLI_ARGS}}

  build:docker-assets:
    desc: "Create shared volumes and networks used by the stack"
    cmds:
      - docker volume inspect pnpm_store >/dev/null 2>&1 || docker volume create pnpm_store
      - docker network inspect observability-bridge >/dev/null 2>&1 || docker network create observability-bridge

  ai:up:
    desc: "Start AI CLI containers"
    vars:
      P_FLAG: '{{if .P}}--profile {{splitList " " .P | join " --profile "}}{{end}}'
    cmds:
      - |
        {{.DOCKER_ENV}}
        docker compose --env-file .env -p {{.PROJECT_NAME}} -f infra/docker-compose.yml --profile {{.AGENT_CORE}} {{.P_FLAG}} up {{.CLI_ARGS}}

  ai:down:
    desc: "Bring down AI CLI container"
    vars:
      P_FLAG: "{{if .P}}--profile {{.P}}{{end}}"
      AI: "{{if .P}}{{.P}}{{end}}"
    cmds:
      - docker compose --env-file .env -p {{.PROJECT_NAME}} {{.P_FLAG}} down {{.AI}}